<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Your Love 💕</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
  <div class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col h-[90vh]">
    
    <!-- Header Board -->
    <header class="bg-pink-600 text-white p-4 text-center shadow-md">
      <h1 class="text-xl font-bold">Connect Your Love 💕</h1>
      <p class="text-xs text-pink-200">Loving Message Portal</p>
    </header>

    <!-- Content Body -->
    <main class="flex-1 p-4 overflow-y-auto space-y-4">
      <div class="bg-pink-50 p-4 rounded-lg text-center border border-pink-200">
        <p class="text-sm text-pink-700 font-semibold">Welcome to Loving Message Portal!</p>
        <p class="text-xs text-gray-500 mt-1">Your real-time love chat system is active.</p>
      </div>

      <!-- Message Area -->
      <div class="bg-pink-500 text-white p-3 rounded-lg max-w-[80%] ml-auto text-right shadow">
        <p class="text-xs text-pink-200 font-bold">You</p>
        <p class="text-sm">Hello! Welcome to Connect Your Love 💕</p>
      </div>
    </main>

    <!-- Bottom Navigation (3 Buttons) -->
    <nav class="bg-gray-50 border-t flex justify-around py-3">
      <button onclick="alert('Search Active')" class="flex flex-col items-center text-gray-500 hover:text-pink-600">
        <span>🔍</span>
        <span class="text-xs font-semibold">Search</span>
      </button>

      <button onclick="alert('Messaging Active')" class="flex flex-col items-center text-pink-600">
        <span>💬</span>
        <span class="text-xs font-semibold">Messaging</span>
      </button>

      <button onclick="alert('Profile Active')" class="flex flex-col items-center text-gray-500 hover:text-pink-600">
        <span>👤</span>
        <span class="text-xs font-semibold">Profile</span>
      </button>
    </nav>

  </div>
</body>
</html>
